[profile.ci]
fail-fast = false
retries = 1

[profile.ci.junit]
path = "junit.xml"
# Failing tests keep their panic output in the report, so CI results show why without the log
store-failure-output = true
store-success-output = false

[profile.default]
# A test running for 30 s is stuck (UI tests normally take ~2 s)
slow-timeout = { period = "10s", terminate-after = 3 }


# The UI tests (`tests::`) run real threads beside GPUI's test clock; on a slow, busy CI runner one
# now and then misses a step. Retry them more before calling the run red.
[[profile.ci.overrides]]
filter = 'test(/^tests::/)'
retries = 3

# Builds and deletes a folder hundreds of levels deep with `\?\` paths; each level costs more than
# the last, so it is slow when the whole suite runs at once.
[[profile.default.overrides]]
filter = 'test(purge_bin_empties_a_very_deep_folder_on_a_small_stack)'
slow-timeout = { period = "30s", terminate-after = 4 }
