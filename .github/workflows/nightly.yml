# Builds a Nightly release. Run by hand for now: the daily schedule (which built only when there
# were commits in the last 24 hours) is off so the releases page isn't flooded with prereleases.
name: nightly

on:
  # schedule:
  #   - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build both exes but publish nothing
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  nightly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: changed today?
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changed.outputs.build == 'true'
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: steps.changed.outputs.build == 'true'
        with:
          tool: cargo-nextest,cargo-about
      - name: test
        if: steps.changed.outputs.build == 'true'
        run: cargo nextest run --locked --workspace --profile ci
      # x64 and ARM64 exes, each with a .sha256, and THIRD_PARTY_LICENSES.md (regenerated by
      # cargo-about); ARM64 is cross-compiled and tests run on x64 only.
      - name: add ARM64 target
        if: steps.changed.outputs.build == 'true'
        run: rustup target add aarch64-pc-windows-msvc
      - name: build only (dry run)
        if: steps.changed.outputs.build == 'true' && inputs.dry_run
        shell: bash
        run: |
          cargo xtask build nightly
          ls -l dist
      - name: publish
        if: steps.changed.outputs.build == 'true' && !inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo xtask publish nightly
