name: uia-scan

# Starts Arke on a Windows runner and reads its UI Automation tree the way a screen reader does:
# controls without names, buttons that cannot be invoked, focusable elements missing from the tree,
# and a Tab walk that must move focus and come back round (no keyboard trap), on a folder page and
# on Home. Findings are annotated and listed in the job summary. Run by hand they fail the job
# (unless "enforce" is off); on pull requests they are only reported until the known ones are fixed.
on:
  workflow_dispatch:
    inputs:
      enforce:
        description: Fail the job on findings
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/uia-scan.ps1"
      - ".github/workflows/uia-scan.yml"

permissions:
  contents: read

concurrency:
  group: uia-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld

jobs:
  scan:
    name: UI Automation scan
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Interactive desktop
        shell: powershell
        run: ./tools/uia-scan.ps1 -CheckDesktop
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: uia-scan
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --locked -p arke-app
      - name: Scan folder page and Home
        shell: powershell
        env:
          ENFORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce && '1' || '' }}
        run: |
          # Both pages always run; the step fails afterwards if either did (when enforced).
          # No splatting of an empty array: it binds a $null positional argument.
          $bad = 0
          foreach ($page in 'folder', 'home') {
            if ($env:ENFORCE) { & ./tools/uia-scan.ps1 -Page $page -Enforce } else { & ./tools/uia-scan.ps1 -Page $page }
            if ($LASTEXITCODE -ne 0) { $bad++ }
          }
          exit $(if ($bad) { 1 } else { 0 })
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: uia-scan-${{ github.sha }}
          path: uia-scan
