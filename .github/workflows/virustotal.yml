# Uploads a release's exes to VirusTotal and adds the scan links to its notes. Runs once the
# release workflow has published, or by hand for an existing tag. The API key lives in the
# VirusTotal environment, so only jobs that ask for that environment can read it. (Not called
# from release.yml with `uses:`: a called workflow got an empty key from the environment.)
name: virustotal

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] only our own release workflow triggers it, on a tag we pushed
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  scan:
    # After a release run only if it published; its head branch is the tag it ran for.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: VirusTotal
    permissions:
      # Appends the links to the release notes.
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: download the exes
        run: gh release download "$TAG" --pattern '*.exe' --dir dist
      # Files under 32 MB go to /files; larger ones (the x64 exe) need a one-time upload URL.
      # Links point at the file's SHA-256 page, which shows the result once the engines finish.
      - name: upload to VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$VT_API_KEY" ]; then
            echo "::error::VT_API_KEY is empty: the job didn't get the VirusTotal environment's secret"
            exit 1
          fi
          links=()
          for exe in dist/*.exe; do
            size=$(stat -c %s "$exe")
            url=https://www.virustotal.com/api/v3/files
            if [ "$size" -ge $((32 * 1024 * 1024)) ]; then
              url=$(curl -sS --fail -H "x-apikey: $VT_API_KEY" \
                https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)
            fi
            curl -sS --fail -H "x-apikey: $VT_API_KEY" -F "file=@$exe" "$url" > /dev/null
            sha=$(sha256sum "$exe" | cut -d' ' -f1)
            name=$(basename "$exe")
            echo "$name uploaded ($size bytes), sha256 $sha"
            links+=("[$name](https://www.virustotal.com/gui/file/$sha)")
          done
          {
            echo "VirusTotal scans of this release:"
            last=$((${#links[@]} - 1))
            for i in "${!links[@]}"; do
              if [ "$i" -lt "$last" ]; then echo "${links[$i]} ·"; else echo "${links[$i]}"; fi
            done
          } > vt-links.md
      # Then which file to download. Both go after the changes: Arke shows the notes in its update
      # notice and stops reading at the VirusTotal line, so neither shows up in the app.
      - name: add the links and the download guide to the release notes
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body > notes.md
          cp notes.md before.md
          if grep -q '^VirusTotal scans of this release:' notes.md; then
            echo "the notes already list VirusTotal scans; left as they are"
          else
            printf '\n\n' >> notes.md
            cat vt-links.md >> notes.md
          fi
          if ! grep -q '^\*\*Which file?\*\*' notes.md; then
            v="${TAG#v}"
            cat >> notes.md <<EOF

          **Which file?** Both are the same Arke: same features, same updates, settings in \`%APPDATA%\Arke\`.

          - \`arke-$v.exe\`: portable. One exe that runs from any folder; nothing is installed, so it isn't in the Start menu or in Settings › Apps. To remove it: Settings › About › Remove Arke from this PC.
          - \`arke-$v-setup.exe\`: installer. Installs for your account (no administrator approval) or for all users in Program Files, and adds Arke to the Start menu and to Settings › Apps, where you can uninstall it.
          - \`-arm64\` in the name: the same for ARM64 PCs. \`.sha256\`: each file's checksum.
          EOF
          fi
          if cmp -s notes.md before.md; then exit 0; fi
          gh release edit "$TAG" --notes-file notes.md
