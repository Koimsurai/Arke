# typos (crate-ci/typos). Only words that were actually flagged go here, each with what it is,
# so the list doesn't grow into something that lets real typos through.

[default]
# Translations in the locale files are other languages, not English typos (the English lines are
# still checked).
extend-ignore-re = ["(?m)^  (ja|de|es|pt-BR): .*$"]

[default.extend-words]
# Windows shell API: FOF_* flags of SHFILEOPSTRUCT, and the `fo` variable holding one
FOF = "FOF"
fo = "fo"
# FORMATETC::ptd (target device pointer)
ptd = "ptd"
# SDDL alias for BUILTIN\Administrators
BA = "BA"
# The flate2 crate
flate = "flate"
# File extension used in a test fixture (game save)
sav = "sav"
# Hidden + System + Archive in the Details Attributes column
HSA = "HSA"
# "report" typed one key at a time in a search test
repor = "repor"

[default.extend-identifiers]
# "PNGs" is split as PN + Gs
PNGs = "PNGs"
# Plug and Play device ids (MTP devices), split as Pn + P
PnP = "PnP"
# Windows' Security Support Provider library, secur32.dll
secur32 = "secur32"

[files]
# THIRD_PARTY_LICENSES.md is generated and quotes license texts and crate names verbatim
# The README translations are prose in other languages.
extend-exclude = [
  "Cargo.lock",
  "THIRD_PARTY_LICENSES.md",
  "third_party",
  "README.ja.md",
  "README.de.md",
  "README.es.md",
  "README.pt-BR.md",
]
