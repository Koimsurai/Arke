[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/app",
    "crates/indexd",
    "crates/remote",
    "tools/genfiles",
    "tools/genicon",
    "tools/xtask",
]
default-members = ["crates/app", "crates/indexd"]
# Patched copies of upstream crates (see third_party/README.md), not workspace members.
exclude = ["third_party"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
arke-core = { path = "crates/core" }
arke-indexd = { path = "crates/indexd" }
arke-remote = { path = "crates/remote" }

# The official `gpui` on crates.io stopped at 0.2.2; `gpui-pre` is a weekly snapshot of Zed
# (0.3.11 = zed@f816e1f). The API changes between snapshots, so the version is pinned.
# Equivalent git source: `git = "https://github.com/zed-industries/zed", rev = "f816e1f"`.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11" }
# Its Windows platform (patched, see `[patch.crates-io]`): Arke takes dropped virtual files from it
gpui_windows = { package = "gpui-pre-windows", version = "=0.3.11" }

windows = "0.62"
# `#[implement]` expands to ::windows_core; keep in step with `windows`
windows-core = "0.62"
notify = "8"
flume = "0.12"
# Search index scan threads, kept between queries (already in the build through image and gpui)
rayon-core = "1"
pulldown-cmark = { version = "0.13", default-features = false }
memmap2 = "0.9"
# Search index name dedup: `HashTable` stores only a node id per name (std's HashMap would need
# the key too); already in the build through accesskit
hashbrown = { version = "0.16", default-features = false }
# Fuzzy matching (Helix's engine). MPL-2.0, used unmodified; see THIRD_PARTY_NOTICES.md
nucleo = "0.5"
# Archive support: zip, tar and .tar.gz. Every method 7-Zip, WinRAR and Bandizip write into a zip
# (#341), and passwords: ZipCrypto and AES (#346). Not the crate's zstd: that is the C library
# (zstd-sys), with its encoder; zstd entries are decoded by ruzstd instead.
zip = { version = "9", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "xz", "ppmd", "aes-crypto"] }
# zstd decoder in pure Rust (MIT), for zip entries compressed with it (#341)
ruzstd = "0.9"
# CRC-32 of the zstd entries ruzstd decodes; already in the build through flate2
crc32fast = "1"
tar = "0.4"
# Office Open XML previews (.docx/.xlsx/.pptx): streaming XML reader, no DTD or entity expansion
quick-xml = "0.42"
# Text of PDFs for content search; defaults off (no rayon, no chrono)
lopdf = { version = "0.47", default-features = false }
flate2 = "1"
# 7z in pure Rust (Apache-2.0): exact Unicode names, byte progress and cancel, and it works on
# Windows 10, whose tar.exe has no LZMA. Also BZip2 and Deflate, and AES-256 passwords (#346).
# Not zstd: 7-Zip itself doesn't write it (only forks do), and it would be the C library.
sevenz-rust2 = { version = "0.25", default-features = false, features = ["ppmd", "bzip2", "deflate", "aes256"] }
# Thumbnails; same version as gpui so decoded frames can be handed over directly
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
# Thumbnails: JPEGs decoded at 1/2 to 1/8 size in the DCT, so a big photo is never held at full size
jpeg-decoder = { version = "0.3", default-features = false }
log = "0.4"
env_logger = "0.11"
unicode-segmentation = "1"
# Locks without poisoning (project rule: no std::sync::Mutex/RwLock/Condvar)
parking_lot = "0.13"
# Typed errors for library and platform code (domain layers); tools use anyhow
thiserror = "2"
anyhow = "1"
# UI translations, embedded at compile time
rust-i18n = "4"
# Settings file (%APPDATA%\Arke\settings.json)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Release tooling and update verification
sha2 = "0.10"
# Update signatures (#249): Arke verifies, the release tooling signs.
minisign-verify = "0.2.5"
minisign = { version = "0.7.9", default-features = false }
# The release tooling reads the signing key's bytes itself (xtask `signing_key`).
base64 = "0.22"

# ─── Lints (crates opt in with `[lints] workspace = true`)
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# From nursery, picked one by one (the whole group is too noisy)
or_fun_call = "warn"                   # `unwrap_or(expensive())` evaluates eagerly
significant_drop_in_scrutinee = "warn" # lock guard held across a match/if-let
significant_drop_tightening = "warn"   # lock guard outlives the critical section
redundant_clone = "warn"
# `Arc::clone(&x)` / `Rc::clone(&x)`: a reference count, not a copy of the data
clone_on_ref_ptr = "warn"
missing_const_for_fn = "warn"
use_self = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
# UI layout math converts between f32 and integers constantly
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# GPUI listener signatures pass by reference
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
# Its suggestion, `assert_eq!(x, [] as [T; 0])`, reads worse than `assert!(x.is_empty())`
assert_is_empty = "allow"

todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
arc_with_non_send_sync = "deny"

unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"             # a function that returns Result passes errors on
map_err_ignore = "warn"               # `map_err(|_| ..)` loses why it failed
allow_attributes_without_reason = "warn" # every #[allow] says why
panic = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
large_futures = "warn"
result_large_err = "warn"
large_stack_arrays = "warn"
large_enum_variant = "warn"
inefficient_to_string = "warn"

# ─── Profiles
[profile.dev]
# Optimize dependencies in dev builds; unoptimized GPUI rendering is misleadingly slow
[profile.dev.package."*"]
opt-level = 2

[profile.release]
# No panic = "abort": a panic on a worker thread should fail that job, not the whole app
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "debuginfo"

# GPUI and its Windows renderer with Arke's changes on top (third_party/README.md lists them).
# Re-apply when gpui-pre is upgraded.
[patch.crates-io]
# Test windows build the accessibility tree, so tests can read it (#322).
gpui-pre = { path = "third_party/gpui-pre" }
gpui-pre-windows = { path = "third_party/gpui-pre-windows" }
