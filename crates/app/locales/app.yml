# ─── Uninstall (Settings > About, arke --uninstall)
uninstall.title:
  en: "Remove Arke from this PC"
  zh-TW: "從這台電腦移除 Arke"
  zh-CN: "从这台电脑卸载 Arke"
uninstall.desc:
  en: "Removes the program, its shortcuts and everything it saved"
  zh-TW: "移除程式、捷徑和它存下的所有資料"
  zh-CN: "删除程序、快捷方式和它保存的所有数据"
uninstall.button:
  en: "Remove…"
  zh-TW: "移除…"
  zh-CN: "卸载…"
uninstall.confirm_title:
  en: "Remove Arke from this PC?"
  zh-TW: "要從這台電腦移除 Arke 嗎？"
  zh-CN: "要从这台电脑卸载 Arke 吗？"
uninstall.intro:
  en: "This removes:"
  zh-TW: "會移除："
  zh-CN: "将删除："
uninstall.keep:
  en: "Keep my settings"
  zh-TW: "保留我的設定"
  zh-CN: "保留我的设置"
uninstall.keep_desc:
  en: "Settings, pinned folders, workspaces and trusted hosts stay for a later reinstall"
  zh-TW: "設定、釘選的資料夾、工作區和信任的主機都會留著，之後重新安裝可以接著用"
  zh-CN: "设置、固定的文件夹、工作区和信任的主机会保留，之后重新安装可以继续使用"
