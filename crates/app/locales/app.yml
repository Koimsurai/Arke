  es: Conservar mi configuración
  pt-BR: Manter minhas configurações
  ja: 設定を残す
uninstall.keep_desc:
  en: "Settings, favorites, workspaces and trusted hosts stay for a later reinstall"
  zh-TW: "設定、最愛、工作區和信任的主機都會留著，之後重新安裝可以接著用"
  zh-CN: "设置、收藏夹、工作区和信任的主机会保留，之后重新安装可以继续使用"
  de: Einstellungen, Favoriten, Arbeitsbereiche und vertrauenswürdige Hosts bleiben für eine spätere Neuinstallation erhalten
  es: La configuración, los favoritos, los espacios de trabajo y los hosts de confianza se conservan para una reinstalación posterior
  pt-BR: Configurações, favoritos, espaços de trabalho e hosts confiáveis permanecem para uma reinstalação futura
  ja: 設定、お気に入り、ワークスペース、信頼済みホストは、再インストール用に残します
uninstall.uac_note:
