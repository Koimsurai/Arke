  zh-TW: "在通知區域顯示圖示"
  zh-CN: "在通知区域显示图标"
  de: Symbol im Infobereich anzeigen
  es: Mostrar icono en el área de notificación
  pt-BR: Mostrar ícone na área de notificação
  ja: 通知領域にアイコンを表示
settings.keep_running:
  en: "Keep running after closing windows"
  zh-TW: "關閉視窗後繼續在背景執行"
  zh-CN: "关闭窗口后继续在后台运行"
  de: Nach dem Schließen der Fenster weiterlaufen
  es: Seguir en ejecución al cerrar las ventanas
  pt-BR: Continuar em execução após fechar as janelas
  ja: ウィンドウを閉じても実行を続ける
settings.keep_running_desc:
  en: "Opens faster next time"
  zh-TW: "下次開啟更快"
  zh-CN: "下次打开更快"
  de: Öffnet beim nächsten Mal schneller
  es: Abre más rápido la próxima vez
  pt-BR: Abre mais rápido na próxima vez
  ja: 次回の起動が速くなります
settings.takeover:
  en: "Open folders in Arke"
  zh-TW: "用 Arke 開啟資料夾"
  zh-CN: "用 Arke 打开文件夹"
  de: Ordner in Arke öffnen
  es: Abrir carpetas en Arke
  pt-BR: Abrir pastas no Arke
  ja: フォルダーを Arke で開く
settings.takeover_desc:
  en: "Registers Arke as the folder handler for this Windows account, so \"Show in folder\" in other apps opens Arke too. Turn it off to undo it"
  zh-TW: "將 Arke 登錄為這個 Windows 帳戶的資料夾開啟程式，其他程式的「在資料夾中顯示」也會開 Arke，關閉即還原"
  zh-CN: "将 Arke 注册为这个 Windows 账户的文件夹打开程序，其他程序的“在文件夹中显示”也会打开 Arke，关闭即还原"
  de: Registriert Arke als Ordner-Handler für dieses Windows-Konto, sodass „Im Ordner anzeigen“ in anderen Apps ebenfalls Arke öffnet. Zum Rückgängigmachen ausschalten
  es: Registra Arke como controlador de carpetas de esta cuenta de Windows, de modo que «Mostrar en carpeta» en otras aplicaciones también abra Arke. Desactívelo para deshacerlo
  pt-BR: "Registra o Arke como manipulador de pastas desta conta do Windows, para que \"Mostrar na pasta\" em outros aplicativos também abra o Arke. Desative para desfazer"
  ja: この Windows アカウントのフォルダー ハンドラーとして Arke を登録し、他のアプリの「フォルダーを開く」でも Arke を開きます。オフにすると元に戻ります
settings.single_window:
  en: "Single window"
  zh-TW: "單一視窗"
  zh-CN: "单一窗口"
  de: Einzelnes Fenster
  es: Ventana única
  pt-BR: Janela única
  ja: シングル ウィンドウ
settings.single_window_desc:
  en: "Folders from other apps, Win+E and starting Arke again add a tab to the window you used last. Off: each gets a new window"
  zh-TW: "從其他程式開啟的資料夾、Win+E 和再次啟動 Arke 都加成最近使用視窗的分頁。關閉則每次都開新視窗"
  zh-CN: "从其他程序打开的文件夹、Win+E 和再次启动 Arke 都加为最近使用窗口的标签页。关闭则每次都开新窗口"
  de: "Ordner aus anderen Apps, Win+E und ein erneuter Start von Arke fügen dem zuletzt verwendeten Fenster eine Registerkarte hinzu. Aus: Jeweils ein neues Fenster"
  es: "Las carpetas de otras aplicaciones, Win+E y volver a iniciar Arke añaden una pestaña a la última ventana usada. Desactivado: cada una abre una ventana nueva"
  pt-BR: "Pastas de outros aplicativos, Win+E e iniciar o Arke novamente adicionam uma guia à última janela usada. Desativado: cada um abre uma nova janela"
  ja: "他のアプリからのフォルダー、Win+E、Arke の再起動は、最後に使ったウィンドウにタブとして追加されます。オフ: それぞれ新しいウィンドウで開きます"
settings.win_e:
  en: "Win+E and the File Explorer icon open Arke too"
  zh-TW: "Win+E 和檔案總管圖示也開 Arke"
  zh-CN: "Win+E 和文件资源管理器图标也打开 Arke"
  de: Win+E und das Datei-Explorer-Symbol öffnen ebenfalls Arke
  es: Win+E y el icono del Explorador de archivos también abren Arke
  pt-BR: Win+E e o ícone do Explorador de Arquivos também abrem o Arke
  ja: Win+E とエクスプローラーのアイコンでも Arke を開く
settings.win_e_desc:
  en: "Off: File Explorer you start yourself stays File Explorer"
  zh-TW: "關閉時，自己開的檔案總管仍是檔案總管"
  zh-CN: "关闭时，自己打开的文件资源管理器仍是文件资源管理器"
  de: "Aus: Ein selbst gestarteter Datei-Explorer bleibt der Datei-Explorer"
  es: "Desactivado: el Explorador de archivos que inicie usted sigue siendo el Explorador de archivos"
  pt-BR: "Desativado: o Explorador de Arquivos iniciado por você continua sendo o Explorador de Arquivos"
  ja: "オフ: 自分で起動したエクスプローラーはエクスプローラーのままです"
settings.nav_scope:
  en: "Back and forward"
  zh-TW: "上一頁／下一頁"
  zh-CN: "上一页／下一页"
  de: Zurück und vorwärts
  es: Atrás y adelante
  pt-BR: Voltar e avançar
  ja: 戻る / 進む
settings.nav_scope_desc:
  en: "Across tabs: once a tab is back at its first folder, back returns to the tab you came from"
  zh-TW: "跨分頁：分頁退到最早的資料夾後，再按上一頁會回到你來之前的分頁"
  zh-CN: "跨标签页：标签页退到最早的文件夹后，再按上一页会回到你来之前的标签页"
  de: "Über Registerkarten hinweg: Ist eine Registerkarte wieder beim ersten Ordner, führt „Zurück“ zur vorherigen Registerkarte"
  es: "Entre pestañas: cuando una pestaña vuelve a su primera carpeta, Atrás regresa a la pestaña de la que venía"
  pt-BR: "Entre guias: quando uma guia volta à primeira pasta, voltar retorna à guia de onde você veio"
  ja: "タブをまたぐ: タブが最初のフォルダーまで戻ると、元のタブに戻ります"
settings.nav_scope_across:
  en: "Across tabs, in the order you went"
  zh-TW: "跨分頁，依你走過的順序"
  zh-CN: "跨标签页，按你走过的顺序"
  de: Über Registerkarten hinweg, in der besuchten Reihenfolge
  es: Entre pestañas, en el orden recorrido
  pt-BR: Entre guias, na ordem em que você foi
  ja: タブをまたぐ（移動した順）
settings.nav_scope_within:
  en: "Within the current tab"
  zh-TW: "只在目前分頁"
  zh-CN: "只在当前标签页"
  de: Innerhalb der aktuellen Registerkarte
  es: Dentro de la pestaña actual
  pt-BR: Dentro da guia atual
  ja: 現在のタブ内のみ
settings.swipe_nav:
  en: "Swipe to go back and forward"
  zh-TW: "滑動切換上一頁／下一頁"
  zh-CN: "滑动切换上一页／下一页"
  de: Wischen für Zurück und Vorwärts
  es: Deslizar para ir atrás y adelante
  pt-BR: Deslizar para voltar e avançar
  ja: スワイプで戻る / 進む
settings.swipe_nav_desc:
  en: "Swipe left or right with two fingers on the touchpad"
  zh-TW: "在觸控板上用兩指左右滑動"
  zh-CN: "在触控板上用两指左右滑动"
  de: Mit zwei Fingern auf dem Touchpad nach links oder rechts wischen
  es: Deslice a izquierda o derecha con dos dedos en el panel táctil
  pt-BR: Deslize para a esquerda ou direita com dois dedos no touchpad
  ja: タッチパッドで 2 本指を左右にスワイプします
settings.fast_recycle:
  en: "Fast Recycle Bin"
  zh-TW: "快速丟回收筒"
  zh-CN: "快速丢回收站"
  de: Schneller Papierkorb
  es: Papelera de reciclaje rápida
  pt-BR: Lixeira rápida
  ja: 高速ごみ箱
settings.fast_recycle_desc:
  en: "On local drives, big folders go to the Recycle Bin at once instead of Windows checking every file first. Restore works as usual; anything else is left to Windows"
  zh-TW: "在本機磁碟上，大資料夾直接進回收筒，不用等 Windows 先逐一檢查每個檔案。還原方式不變，其他情況照樣交給 Windows"
  zh-CN: "在本机磁盘上，大文件夹直接进回收站，不用等 Windows 先逐一检查每个文件。还原方式不变，其他情况照样交给 Windows"
  de: Auf lokalen Laufwerken wandern große Ordner sofort in den Papierkorb, ohne dass Windows zuerst jede Datei prüft. Wiederherstellen funktioniert wie gewohnt; alles andere übernimmt Windows
  es: En unidades locales, las carpetas grandes van a la Papelera de reciclaje de una vez, sin que Windows compruebe antes cada archivo. Restaurar funciona como siempre; el resto lo gestiona Windows
  pt-BR: Em unidades locais, pastas grandes vão para a Lixeira de uma vez, em vez de o Windows verificar cada arquivo antes. Restaurar funciona normalmente; o resto fica com o Windows
  ja: ローカル ドライブでは、Windows が全ファイルを確認する代わりに、大きなフォルダーをすぐごみ箱に移動します。復元は通常どおり。それ以外は Windows に任せます
settings.fast_copy:
