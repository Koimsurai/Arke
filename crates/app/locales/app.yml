  zh-TW: "「%{name}」會移到資源回收筒。"
  zh-CN: "“%{name}”将移到回收站。"
  de: "„%{name}“ wird in den Papierkorb verschoben."
  es: "“%{name}” se moverá a la Papelera de reciclaje."
