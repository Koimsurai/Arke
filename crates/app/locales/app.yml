update.rolled_back:
  en: "the new version couldn't start (antivirus software may have blocked it), so Arke stays on this version. Allow arke.exe in your antivirus and update again. (%{error})"
  zh-TW: 新版本無法啟動（可能被防毒軟體擋下），Arke 維持在目前版本。請在防毒軟體中允許 arke.exe 後再更新一次。（%{error}）
  zh-CN: 新版本无法启动（可能被杀毒软件拦截），Arke 保持在当前版本。请在杀毒软件中允许 arke.exe 后再更新一次。（%{error}）
  de: Die neue Version konnte nicht gestartet werden (möglicherweise von Antivirensoftware blockiert); Arke bleibt auf dieser Version. Erlauben Sie arke.exe in Ihrer Antivirensoftware und aktualisieren Sie erneut. (%{error})
  es: la nueva versión no pudo iniciarse (puede que el antivirus la haya bloqueado), por lo que Arke se queda en esta versión. Permita arke.exe en su antivirus y actualice de nuevo. (%{error})
  pt-BR: a nova versão não pôde iniciar (um antivírus pode tê-la bloqueado), então o Arke permanece nesta versão. Permita o arke.exe no seu antivírus e atualize novamente. (%{error})
  ja: 新しいバージョンを起動できませんでした（ウイルス対策ソフトがブロックした可能性があります）。Arke はこのバージョンのままです。ウイルス対策ソフトで arke.exe を許可してから、もう一度更新してください。(%{error})
