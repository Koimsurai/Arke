  zh-CN: 请检查服务器名称和端口
  de: Servername und Port prüfen
  es: Compruebe el nombre del servidor y el puerto
  pt-BR: Verifique o nome do servidor e a porta
  ja: サーバー名とポートを確認してください
net.need_key:
