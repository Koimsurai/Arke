settings.service_desc:
  en: Catches up on changes made while Arke is closed and builds the index faster. Needs administrator approval.
  zh-TW: Arke 關閉期間的變更也能補上，建索引也更快。需要系統管理員同意。
  zh-CN: Arke 关闭期间的更改也能补上，建立索引也更快。需要管理员批准。
  de: Holt Änderungen nach, die bei geschlossenem Arke erfolgten, und erstellt den Index schneller. Erfordert Administratorgenehmigung.
  es: Se pone al día con los cambios hechos mientras Arke está cerrado y crea el índice más rápido. Requiere aprobación de administrador.
  pt-BR: Recupera as alterações feitas enquanto o Arke está fechado e cria o índice mais rápido. Requer aprovação de administrador.
  ja: Arke を閉じている間の変更を反映し、インデックスをより速く作成します。管理者の承認が必要です。
settings.service_outdated:
  en: "Installed with another version of Arke, so it misses this version's improvements. Update it to match; needs administrator approval."
  zh-TW: "是用另一個版本的 Arke 安裝的，沒有這個版本的改進。請更新成相同版本；需要系統管理員同意。"
  zh-CN: "是用另一个版本的 Arke 安装的，没有这个版本的改进。请更新成相同版本；需要管理员批准。"
  de: Mit einer anderen Arke-Version installiert und deshalb ohne die Verbesserungen dieser Version. Aktualisieren Sie ihn; erfordert Administratorgenehmigung.
  es: Instalado con otra versión de Arke, por lo que no tiene las mejoras de esta versión. Actualícelo para que coincida; requiere aprobación de administrador.
  pt-BR: Instalado com outra versão do Arke, por isso não tem as melhorias desta versão. Atualize para corresponder; requer aprovação de administrador.
  ja: 別のバージョンの Arke でインストールされているため、このバージョンの改善が反映されません。更新して合わせてください。管理者の承認が必要です。
