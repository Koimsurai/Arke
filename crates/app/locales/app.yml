welcome.body:
  en: "Arke is a single program file. A Start menu shortcut makes it easy to find and pin."
  zh-TW: "Arke 只是一個程式檔。加到開始功能表就容易找到，也能釘選。"
  zh-CN: "Arke 只是一个程序文件。添加到开始菜单后更容易找到，也能固定。"
  de: Arke ist eine einzelne Programmdatei. Eine Startmenü-Verknüpfung macht es leicht zu finden und anzuheften.
  es: Arke es un único archivo de programa. Un acceso directo en el menú Inicio facilita encontrarlo y anclarlo.
  pt-BR: O Arke é um único arquivo de programa. Um atalho no menu Iniciar facilita encontrá-lo e fixá-lo.
  ja: Arke は単一のプログラム ファイルです。スタート メニューにショートカットがあると、見つけやすく、ピン留めもできます。
