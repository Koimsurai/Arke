  es: Iniciar al iniciar sesión en Windows
  pt-BR: Iniciar quando eu entrar no Windows
  ja: Windows にサインインしたときに起動
settings.autostart_desc:
  en: "Waits in the background without a window"
  zh-TW: "在背景待命，不開視窗"
  zh-CN: "在后台待命，不打开窗口"
  de: Wartet ohne Fenster im Hintergrund
  es: Espera en segundo plano sin ventana
  pt-BR: Fica em espera em segundo plano, sem janela
  ja: ウィンドウなしでバックグラウンドで待機します
settings.tray:
