  zh-CN: "卸载搜索服务时，Windows 会请求管理员批准。"
  de: Windows fragt nach der Administratorgenehmigung, um den Suchdienst zu entfernen.
  es: Windows pedirá aprobación de administrador para quitar el servicio de búsqueda.
  pt-BR: O Windows pedirá aprovação de administrador para remover o serviço de pesquisa.
  ja: 検索サービスを削除するため、Windows が管理者の承認を求めます。
