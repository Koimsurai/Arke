  zh-CN: "删除程序、快捷方式和它保存的所有数据"
  de: Entfernt das Programm, seine Verknüpfungen und alles, was es gespeichert hat
  es: Quita el programa, sus accesos directos y todo lo que guardó
  pt-BR: Remove o programa, seus atalhos e tudo o que ele salvou
