  zh-TW: 安裝程式在安裝前就結束了（例如在 Windows 的權限確認視窗按了「否」），Arke 維持在目前版本。再更新一次即可重試。
  zh-CN: 安装程序在安装前就退出了（例如在 Windows 的权限确认窗口点了“否”），Arke 保持在当前版本。再更新一次即可重试。
