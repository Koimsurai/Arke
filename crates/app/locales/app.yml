  pt-BR: Substituir a chave e conectar
  ja: キーを置き換えて接続
net.insecure_title:
  en: This connection is not encrypted
  zh-TW: 這個連線沒有加密
  zh-CN: 此连接没有加密
  de: Diese Verbindung ist nicht verschlüsselt
  es: Esta conexión no está cifrada
  pt-BR: Esta conexão não é criptografada
  ja: この接続は暗号化されていません
net.insecure_body:
  en: "The password would be sent as plain text. Anyone on the network could read it. Allow this only for a server on a network you trust."
  zh-TW: 密碼會以明文傳送，同一個網路上的人都有可能看到。只在你信任的網路上的伺服器才允許。
  zh-CN: 密码会以明文发送，同一网络上的人都有可能看到。只在你信任的网络上的服务器才允许。
  de: Das Kennwort würde als Klartext gesendet. Jeder im Netzwerk könnte es lesen. Erlauben Sie dies nur für einen Server in einem vertrauenswürdigen Netzwerk.
  es: La contraseña se enviaría como texto sin formato. Cualquier persona en la red podría leerla. Permítalo solo para un servidor en una red de confianza.
  pt-BR: A senha seria enviada como texto simples. Qualquer pessoa na rede poderia lê-la. Permita isso somente para um servidor em uma rede de confiança.
  ja: パスワードが平文で送信されます。ネットワーク上の誰でも読み取れる可能性があります。信頼できるネットワーク上のサーバーにのみ許可してください。
