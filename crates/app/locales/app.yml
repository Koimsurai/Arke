workspaces.intro:
  en: Save these tabs to come back to them later. Opening a workspace replaces the open tabs; pinned tabs stay.
  zh-TW: 儲存目前的分頁，之後隨時回來。開啟工作區會取代目前的分頁，釘選的分頁會保留。
  zh-CN: 保存当前的标签页，之后随时回来。打开工作区会替换当前的标签页，固定的标签页会保留。
  de: Speichern Sie diese Registerkarten, um später zu ihnen zurückzukehren. Beim Öffnen eines Arbeitsbereichs werden die geöffneten Registerkarten ersetzt; angeheftete bleiben.
  es: Guarde estas pestañas para volver a ellas más tarde. Abrir un espacio de trabajo reemplaza las pestañas abiertas; las ancladas se conservan.
  pt-BR: Salve estas guias para voltar a elas depois. Abrir um espaço de trabalho substitui as guias abertas; as fixadas permanecem.
  ja: 現在のタブを保存して、後で戻れるようにします。ワークスペースを開くと、開いているタブが置き換わります。ピン留めしたタブは残ります。
