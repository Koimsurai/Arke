  zh-TW: "在整台電腦的結果中，常開的檔案和資料夾會排在相近的結果前面。只存在這台電腦。"
  zh-CN: "在整台电脑的结果中，常打开的文件和文件夹会排在相近的结果前面。只保存在这台电脑。"
  de: Geöffnete Dateien und besuchte Ordner stehen in den Ergebnissen für Dieser PC vor ähnlichen Treffern. Wird nur auf diesem PC gespeichert.
  es: Los archivos que abre y las carpetas que visita se sitúan por encima de coincidencias similares en los resultados de Este equipo. Se guarda solo en este equipo.
  pt-BR: Arquivos que você abre e pastas que visita ficam acima de resultados semelhantes em Este Computador. Mantido apenas neste computador.
  ja: PC の検索結果で、開いたファイルや訪れたフォルダーを類似の一致より上に表示します。この PC にのみ保存されます。
