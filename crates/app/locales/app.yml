  zh-TW: 第一次連線到這台伺服器
  zh-CN: 第一次连接到此服务器
  de: Erste Verbindung mit diesem Server
  es: Primera conexión a este servidor
  pt-BR: Primeira conexão com este servidor
  ja: このサーバーへの初回接続
net.key_new_body:
  en: "Make sure the fingerprint below matches the server's (ask its admin if unsure)."
  zh-TW: 請確認下方的指紋與伺服器的一致（不確定就問管理員）。
  zh-CN: 请确认下方的指纹与服务器的一致（不确定就问管理员）。
  de: Stellen Sie sicher, dass der Fingerabdruck unten mit dem des Servers übereinstimmt (im Zweifel den Administrator fragen).
  es: Asegúrese de que la huella digital siguiente coincide con la del servidor (pregunte a su administrador si tiene dudas).
  pt-BR: Confirme que a impressão digital abaixo corresponde à do servidor (pergunte ao administrador se tiver dúvida).
  ja: 下のフィンガープリントがサーバーのものと一致することを確認してください（不明な場合は管理者に確認）。
net.key_trust:
  en: Trust and connect
  zh-TW: 信任並連線
  zh-CN: 信任并连接
  de: Vertrauen und verbinden
  es: Confiar y conectar
  pt-BR: Confiar e conectar
  ja: 信頼して接続
net.key_changed_title:
  en: "Warning: the server's key has changed"
  zh-TW: 警告：伺服器的金鑰變了
  zh-CN: 警告：服务器的密钥变了
  de: "Warnung: Der Schlüssel des Servers hat sich geändert"
  es: "Advertencia: la clave del servidor ha cambiado"
  pt-BR: "Aviso: a chave do servidor mudou"
  ja: "警告: サーバーのキーが変更されました"
net.key_changed_body:
  en: "%{host} no longer has the key Arke saw before. Someone may be intercepting the connection. Only continue if you know the server was reinstalled or its key replaced."
  zh-TW: "%{host} 的金鑰和 Arke 先前看到的不同，可能有人在攔截連線。只有確定伺服器重灌或換過金鑰時才繼續。"
  zh-CN: "%{host} 的密钥与 Arke 之前看到的不同，可能有人在拦截连接。只有确定服务器重装或更换过密钥时才继续。"
  de: "%{host} hat nicht mehr den Schlüssel, den Arke zuvor gesehen hat. Möglicherweise fängt jemand die Verbindung ab. Fahren Sie nur fort, wenn Sie wissen, dass der Server neu installiert oder sein Schlüssel ersetzt wurde."
  es: "%{host} ya no tiene la clave que Arke vio antes. Es posible que alguien esté interceptando la conexión. Continúe solo si sabe que el servidor se reinstaló o que su clave se reemplazó."
  pt-BR: "%{host} não tem mais a chave que o Arke viu antes. Alguém pode estar interceptando a conexão. Continue somente se souber que o servidor foi reinstalado ou que a chave foi substituída."
  ja: "%{host} は、Arke が以前確認したキーを使っていません。接続が傍受されている可能性があります。サーバーを再インストールした、またはキーを入れ替えたと分かっている場合のみ続行してください。"
net.key_replace:
