  zh-CN: 今年

# ─── Network locations (SMB)
io.net_not_found:
  en: "Can't find the network path; check the server name and that the server is on"
  zh-TW: "找不到網路路徑，請檢查伺服器名稱並確認伺服器已開機"
  zh-CN: "找不到网络路径，请检查服务器名称并确认服务器已开机"
io.net_offline:
  en: "The server isn't responding; check your network or VPN connection"
  zh-TW: "伺服器沒有回應，請檢查網路或 VPN 連線"
  zh-CN: "服务器没有响应，请检查网络或 VPN 连接"
io.net_no_share:
  en: The server has no shared folder with this name
  zh-TW: 伺服器上沒有這個共用資料夾
  zh-CN: 服务器上没有这个共享文件夹
io.net_other_account:
  en: You're already connected to this server with a different account; disconnect it first
  zh-TW: "已經用其他帳戶連到這台伺服器，請先中斷該連線"
  zh-CN: "已使用其他帐户连接到此服务器，请先断开该连接"
io.net_login:
  en: You need to sign in to this server
  zh-TW: 需要登入這台伺服器
  zh-CN: 需要登录此服务器
io.net_account:
  en: The server didn't accept your account (password expired, account locked, or restricted)
  zh-TW: "伺服器不接受這個帳戶（密碼過期、帳戶遭鎖定或受限制）"
  zh-CN: 服务器不接受此帐户（密码过期、帐户被锁定或受限）
io.net_denied:
  en: Access denied; you may need to sign in with another account
  zh-TW: "沒有存取權限，可能要用其他帳戶登入"
  zh-CN: 没有访问权限，可能需要使用其他帐户登录
io.net_no_host:
  en: Can't find a server named %{server}
  zh-TW: 找不到名為 %{server} 的伺服器
  zh-CN: 找不到名为 %{server} 的服务器
io.net_down:
  en: Can't reach %{server} (it may be off, or the network or VPN is down)
  zh-TW: 連不到 %{server}（可能沒開機，或網路、VPN 斷了）
  zh-CN: 无法连接到 %{server}（可能未开机，或网络、VPN 已断开）
