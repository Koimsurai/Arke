# ─── File name validation (path::validate_file_name)
name.empty:
  en: The name can't be empty
  zh-TW: 名稱不能是空白
  zh-CN: 名称不能为空
name.bad_chars:
  en: 'A name can''t contain any of these characters: \ / : * ? " < > |'
  zh-TW: '名稱不能包含下列字元：\ / : * ? " < > |'
  zh-CN: '名称不能包含下列字符：\ / : * ? " < > |'
name.trailing:
  en: A name can't end with a period or a space
  zh-TW: 名稱結尾不能是句點或空白
  zh-CN: 名称不能以句点或空格结尾
name.too_long:
  en: The name is too long
  zh-TW: 名稱太長
  zh-CN: 名称太长
name.reserved:
  en: This name is reserved by Windows
  zh-TW: 這是 Windows 保留的名稱
  zh-CN: 这是 Windows 保留的名称

# ─── Listing errors (service)
io.internal:
  en: "Internal error (logged); please report it"
  zh-TW: 內部錯誤（已記錄），請回報
  zh-CN: 内部错误（已记录），请反馈
io.not_found:
  en: This location can't be found
  zh-TW: 找不到這個位置
  zh-CN: 找不到此位置
io.denied:
  en: Access denied
  zh-TW: 沒有存取權限
  zh-CN: 没有访问权限
io.not_dir:
  en: "This isn't a folder"
  zh-TW: 這不是資料夾
  zh-CN: 这不是文件夹
io.too_large:
  en: The file is too large
  zh-TW: 檔案太大
  zh-CN: 文件太大

# ─── Extraction (archive)
archive.folder_fallback:
  en: Extracted
  zh-TW: 解壓縮
  zh-CN: 解压
archive.exists:
  en: "%{path} already exists"
  zh-TW: "%{path} 已經存在"
  zh-CN: "%{path} 已存在"
archive.zip_failed:
  en: "Couldn't create the zip file: %{error}"
  zh-TW: "無法建立 zip 檔：%{error}"
  zh-CN: "无法创建 zip 文件：%{error}"
archive.create_failed:
  en: "Couldn't create %{path}: %{error}"
  zh-TW: "無法建立 %{path}：%{error}"
  zh-CN: "无法创建 %{path}：%{error}"
archive.open_failed:
  en: "Couldn't open the archive: %{error}"
  zh-TW: "無法開啟壓縮檔：%{error}"
  zh-CN: "无法打开压缩文件：%{error}"
archive.write_failed:
  en: "Couldn't write %{path}: %{error}"
  zh-TW: "無法寫入 %{path}：%{error}"
  zh-CN: "无法写入 %{path}：%{error}"
archive.read_failed:
  en: "Couldn't read the archive (%{name}): %{error}"
  zh-TW: "壓縮檔讀取失敗（%{name}）：%{error}"
  zh-CN: "压缩文件读取失败（%{name}）：%{error}"
archive.not_zip:
  en: "Not a valid zip file: %{error}"
  zh-TW: "不是有效的 zip 檔：%{error}"
  zh-CN: "不是有效的 zip 文件：%{error}"
archive.not_tar:
  en: "Not a valid tar file: %{error}"
  zh-TW: "不是有效的 tar 檔：%{error}"
  zh-CN: "不是有效的 tar 文件：%{error}"
archive.corrupt:
  en: "The archive is damaged: %{error}"
  zh-TW: "壓縮檔損毀：%{error}"
  zh-CN: "压缩文件已损坏：%{error}"
archive.not_format:
  en: "Not a valid %{format} file: %{error}"
  zh-TW: "不是有效的 %{format} 檔：%{error}"
  zh-CN: "不是有效的 %{format} 文件：%{error}"
archive.encrypted:
  en: "Arke can't open password-protected archives yet"
  zh-TW: "Arke 還無法開啟有密碼保護的壓縮檔"
  zh-CN: "Arke 暂时无法打开受密码保护的压缩文件"
archive.unsupported_method:
  en: "This archive uses a compression method Arke can't read (%{method})"
  zh-TW: "這個壓縮檔使用 Arke 無法讀取的壓縮方式（%{method}）"
  zh-CN: "此压缩文件使用了 Arke 无法读取的压缩方式（%{method}）"
archive.system_missing:
  en: "Opening %{format} files needs Windows 11 version 23H2 or later"
  zh-TW: "開啟 %{format} 檔需要 Windows 11 23H2 以上版本"
  zh-CN: "打开 %{format} 文件需要 Windows 11 23H2 或更高版本"
archive.system_unsupported:
  en: "This version of Windows can't read this %{format} file (%{error}). The file may be damaged, or it may need Windows 11 version 23H2 or later."
  zh-TW: "這個 Windows 版本無法讀取這個 %{format} 檔（%{error}）。檔案可能已損毀，或需要 Windows 11 23H2 以上版本。"
  zh-CN: "此 Windows 版本无法读取这个 %{format} 文件（%{error}）。文件可能已损坏，或需要 Windows 11 23H2 或更高版本。"
archive.system_names:
  en: "This version of Windows can't handle some file names in this archive (characters outside the system language). Files before them were kept; Windows 11 version 23H2 or later can extract it all."
  zh-TW: "這個 Windows 版本無法處理壓縮檔裡的部分檔名（含系統語言以外的字元）。之前的檔案已保留；Windows 11 23H2 以上版本可以完整解壓縮。"
  zh-CN: "此 Windows 版本无法处理压缩文件中的部分文件名（含系统语言以外的字符）。之前的文件已保留；Windows 11 23H2 或更高版本可以完整解压。"
archive.tar_failed:
  en: "Windows' tar.exe failed: %{error}"
  zh-TW: "Windows 的 tar.exe 執行失敗：%{error}"
  zh-CN: "Windows 的 tar.exe 运行失败：%{error}"
archive.run_failed:
  en: "Couldn't run %{path}: %{error}"
  zh-TW: "無法執行 %{path}：%{error}"
  zh-CN: "无法运行 %{path}：%{error}"
archive.needs_file:
  en: "%{format} archives can only be read from a file on disk"
  zh-TW: "%{format} 壓縮檔只能從磁碟上的檔案讀取"
  zh-CN: "%{format} 压缩文件只能从磁盘上的文件读取"

