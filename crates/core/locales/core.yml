# ─── Network locations (SMB)
io.net_not_found:
  en: "Can't find the network path; check the server name and that the server is on"
  zh-TW: "找不到網路路徑，請檢查伺服器名稱並確認伺服器已開機"
  zh-CN: "找不到网络路径，请检查服务器名称并确认服务器已开机"
  de: Der Netzwerkpfad wurde nicht gefunden; Servername prüfen und ob der Server eingeschaltet ist
  es: No se encuentra la ruta de red; compruebe el nombre del servidor y que esté encendido
  pt-BR: Não foi possível encontrar o caminho de rede; verifique o nome do servidor e se ele está ligado
  ja: ネットワーク パスが見つかりません。サーバー名とサーバーの電源を確認してください
io.net_offline:
  en: "The server isn't responding; check your network or VPN connection"
  zh-TW: "伺服器沒有回應，請檢查網路或 VPN 連線"
  zh-CN: "服务器没有响应，请检查网络或 VPN 连接"
  de: Der Server antwortet nicht; Netzwerk- oder VPN-Verbindung prüfen
  es: El servidor no responde; compruebe su conexión de red o VPN
  pt-BR: O servidor não está respondendo; verifique sua rede ou conexão VPN
  ja: サーバーが応答しません。ネットワークまたは VPN の接続を確認してください
io.net_no_share:
  en: The server has no shared folder with this name
  zh-TW: 伺服器上沒有這個共用資料夾
  zh-CN: 服务器上没有这个共享文件夹
  de: Der Server hat keinen freigegebenen Ordner mit diesem Namen
  es: El servidor no tiene ninguna carpeta compartida con este nombre
  pt-BR: O servidor não tem pasta compartilhada com este nome
  ja: サーバーにこの名前の共有フォルダーがありません
io.net_other_account:
  en: You're already connected to this server with a different account; disconnect it first
  zh-TW: "已經用其他帳戶連到這台伺服器，請先中斷該連線"
  zh-CN: "已使用其他帐户连接到此服务器，请先断开该连接"
  de: Sie sind bereits mit einem anderen Konto mit diesem Server verbunden; trennen Sie diese Verbindung zuerst
  es: Ya está conectado a este servidor con otra cuenta; desconéctela primero
  pt-BR: Você já está conectado a este servidor com outra conta; desconecte-a primeiro
  ja: このサーバーには既に別のアカウントで接続されています。先に切断してください
io.net_login:
  en: You need to sign in to this server
  zh-TW: 需要登入這台伺服器
  zh-CN: 需要登录此服务器
  de: Sie müssen sich an diesem Server anmelden
  es: Debe iniciar sesión en este servidor
  pt-BR: É preciso entrar neste servidor
  ja: このサーバーにサインインする必要があります
io.net_account:
  en: The server didn't accept your account (password expired, account locked, or restricted)
  zh-TW: "伺服器不接受這個帳戶（密碼過期、帳戶遭鎖定或受限制）"
  zh-CN: 服务器不接受此帐户（密码过期、帐户被锁定或受限）
  de: Der Server hat Ihr Konto nicht akzeptiert (Kennwort abgelaufen, Konto gesperrt oder eingeschränkt)
  es: El servidor no aceptó su cuenta (contraseña caducada, cuenta bloqueada o restringida)
  pt-BR: O servidor não aceitou sua conta (senha expirada, conta bloqueada ou restrita)
  ja: サーバーがアカウントを受け付けませんでした（パスワードの期限切れ、アカウントのロック、または制限）
io.net_denied:
  en: Access denied; you may need to sign in with another account
  zh-TW: "沒有存取權限，可能要用其他帳戶登入"
  zh-CN: 没有访问权限，可能需要使用其他帐户登录
  de: Zugriff verweigert; melden Sie sich möglicherweise mit einem anderen Konto an
  es: Acceso denegado; puede que deba iniciar sesión con otra cuenta
  pt-BR: Acesso negado; talvez seja preciso entrar com outra conta
  ja: アクセスが拒否されました。別のアカウントでサインインする必要があるかもしれません
io.net_no_host:
  en: Can't find a server named %{server}
  zh-TW: 找不到名為 %{server} 的伺服器
  zh-CN: 找不到名为 %{server} 的服务器
  de: Ein Server mit dem Namen %{server} wurde nicht gefunden
  es: No se encuentra un servidor llamado %{server}
  pt-BR: Não foi possível encontrar um servidor chamado %{server}
  ja: "%{server} というサーバーが見つかりません"
io.net_down:
  en: Can't reach %{server} (it may be off, or the network or VPN is down)
  zh-TW: 連不到 %{server}（可能沒開機，或網路、VPN 斷了）
  zh-CN: 无法连接到 %{server}（可能未开机，或网络、VPN 已断开）
  de: "%{server} ist nicht erreichbar (möglicherweise ausgeschaltet, oder Netzwerk bzw. VPN ist ausgefallen)"
  es: No se puede acceder a %{server} (puede estar apagado, o la red o la VPN no funciona)
  pt-BR: Não foi possível acessar %{server} (pode estar desligado, ou a rede ou a VPN está fora do ar)
  ja: "%{server} に接続できません（電源が切れているか、ネットワークまたは VPN が停止している可能性があります）"
