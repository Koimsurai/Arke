  pt-BR: "Não é um arquivo %{format} válido: %{error}"
  ja: "有効な %{format} ファイルではありません: %{error}"
archive.encrypted:
  en: This archive is password-protected
  zh-TW: 這個壓縮檔有密碼保護
  zh-CN: 此压缩文件受密码保护
  de: Dieses Archiv ist kennwortgeschützt
  es: Este archivo comprimido está protegido con contraseña
  pt-BR: Este arquivo compactado é protegido por senha
  ja: このアーカイブはパスワードで保護されています
archive.wrong_password:
  en: The password is incorrect
  zh-TW: 密碼不正確
  zh-CN: 密码不正确
  de: Das Kennwort ist falsch
  es: La contraseña no es correcta
  pt-BR: A senha está incorreta
  ja: パスワードが正しくありません
archive.unsupported_method:
  en: "Compressed with %{method}, which Arke can't read"
  zh-TW: "以 %{method} 壓縮，Arke 無法讀取"
  zh-CN: "以 %{method} 压缩，Arke 无法读取"
  de: "Mit %{method} komprimiert, das kann Arke nicht lesen"
  es: Comprimido con %{method}, que Arke no puede leer
  pt-BR: Compactado com %{method}, que o Arke não consegue ler
  ja: "%{method} で圧縮されており、Arke では読み取れません"
archive.system_missing:
  en: "Opening %{format} files needs Windows 11 version 23H2 or later"
  zh-TW: "開啟 %{format} 檔需要 Windows 11 23H2 以上版本"
  zh-CN: "打开 %{format} 文件需要 Windows 11 23H2 或更高版本"
  de: Zum Öffnen von %{format}-Dateien ist Windows 11 Version 23H2 oder höher erforderlich
  es: Abrir archivos %{format} requiere Windows 11 versión 23H2 o posterior
  pt-BR: Abrir arquivos %{format} requer o Windows 11 versão 23H2 ou posterior
  ja: "%{format} ファイルを開くには Windows 11 バージョン 23H2 以降が必要です"
archive.system_unsupported:
  en: "This version of Windows can't read this %{format} file (%{error}). The file may be damaged, or it may need Windows 11 version 23H2 or later."
  zh-TW: "這個 Windows 版本無法讀取這個 %{format} 檔（%{error}）。檔案可能已損毀，或需要 Windows 11 23H2 以上版本。"
  zh-CN: "此 Windows 版本无法读取这个 %{format} 文件（%{error}）。文件可能已损坏，或需要 Windows 11 23H2 或更高版本。"
  de: Diese Windows-Version kann diese %{format}-Datei nicht lesen (%{error}). Die Datei ist möglicherweise beschädigt oder erfordert Windows 11 Version 23H2 oder höher.
  es: Esta versión de Windows no puede leer este archivo %{format} (%{error}). El archivo puede estar dañado o requerir Windows 11 versión 23H2 o posterior.
  pt-BR: Esta versão do Windows não consegue ler este arquivo %{format} (%{error}). O arquivo pode estar danificado ou exigir o Windows 11 versão 23H2 ou posterior.
  ja: このバージョンの Windows では、この %{format} ファイルを読み取れません (%{error})。ファイルが破損しているか、Windows 11 バージョン 23H2 以降が必要な可能性があります。
archive.system_names:
  en: "This version of Windows can't handle some file names in this archive (characters outside the system language). Files before them were kept; Windows 11 version 23H2 or later can extract it all."
  zh-TW: "這個 Windows 版本無法處理壓縮檔裡的部分檔名（含系統語言以外的字元）。之前的檔案已保留；Windows 11 23H2 以上版本可以完整解壓縮。"
  zh-CN: "此 Windows 版本无法处理压缩文件中的部分文件名（含系统语言以外的字符）。之前的文件已保留；Windows 11 23H2 或更高版本可以完整解压。"
  de: Diese Windows-Version kann einige Dateinamen in diesem Archiv nicht verarbeiten (Zeichen außerhalb der Systemsprache). Davor liegende Dateien wurden behalten; Windows 11 Version 23H2 oder höher kann alles extrahieren.
  es: Esta versión de Windows no puede procesar algunos nombres de archivo de este archivo comprimido (caracteres fuera del idioma del sistema). Se conservaron los anteriores; Windows 11 versión 23H2 o posterior puede extraerlo todo.
  pt-BR: Esta versão do Windows não consegue lidar com alguns nomes de arquivo neste arquivo compactado (caracteres fora do idioma do sistema). Os arquivos anteriores foram mantidos; o Windows 11 versão 23H2 ou posterior consegue extrair tudo.
  ja: このバージョンの Windows では、このアーカイブ内の一部のファイル名（システム言語以外の文字）を処理できません。それより前のファイルは保持されました。Windows 11 バージョン 23H2 以降なら、すべて展開できます。
archive.tar_failed:
  en: "Windows' tar.exe failed: %{error}"
  zh-TW: "Windows 的 tar.exe 執行失敗：%{error}"
  zh-CN: "Windows 的 tar.exe 运行失败：%{error}"
  de: "tar.exe von Windows ist fehlgeschlagen: %{error}"
  es: "Error de tar.exe de Windows: %{error}"
  pt-BR: "O tar.exe do Windows falhou: %{error}"
  ja: "Windows の tar.exe が失敗しました: %{error}"
archive.run_failed:
  en: "Couldn't run %{path}: %{error}"
  zh-TW: "無法執行 %{path}：%{error}"
  zh-CN: "无法运行 %{path}：%{error}"
  de: "%{path} konnte nicht ausgeführt werden: %{error}"
  es: "No se pudo ejecutar %{path}: %{error}"
  pt-BR: "Não foi possível executar %{path}: %{error}"
  ja: "%{path} を実行できませんでした: %{error}"
archive.needs_file:
  en: "%{format} archives can only be read from a file on disk"
  zh-TW: "%{format} 壓縮檔只能從磁碟上的檔案讀取"
  zh-CN: "%{format} 压缩文件只能从磁盘上的文件读取"
  de: "%{format}-Archive können nur aus einer Datei auf dem Datenträger gelesen werden"
  es: Los archivos %{format} solo se pueden leer desde un archivo en disco
  pt-BR: Arquivos compactados %{format} só podem ser lidos a partir de um arquivo em disco
  ja: "%{format} アーカイブは、ディスク上のファイルからのみ読み取れます"

