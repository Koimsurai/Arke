# ─── File name validation (path::validate_file_name)
name.empty:
  en: The name can't be empty
  zh-TW: 名稱不能是空白
  zh-CN: 名称不能为空
  de: Der Name darf nicht leer sein
  es: El nombre no puede estar vacío
  pt-BR: O nome não pode ficar vazio
  ja: 名前を空にすることはできません
name.bad_chars:
  en: 'A name can''t contain any of these characters: \ / : * ? " < > |'
  zh-TW: '名稱不能包含下列字元：\ / : * ? " < > |'
  zh-CN: '名称不能包含下列字符：\ / : * ? " < > |'
  de: "Ein Name darf keines der folgenden Zeichen enthalten: \\ / : * ? \" < > |"
  es: "Un nombre no puede contener ninguno de estos caracteres: \\ / : * ? \" < > |"
  pt-BR: "Um nome não pode conter nenhum destes caracteres: \\ / : * ? \" < > |"
  ja: "名前に次の文字は使えません: \\ / : * ? \" < > |"
name.trailing:
  en: A name can't end with a period or a space
  zh-TW: 名稱結尾不能是句點或空白
  zh-CN: 名称不能以句点或空格结尾
  de: Ein Name darf nicht mit einem Punkt oder Leerzeichen enden
  es: Un nombre no puede terminar en punto ni en espacio
  pt-BR: Um nome não pode terminar com ponto ou espaço
  ja: 名前の末尾にピリオドやスペースは使えません
name.too_long:
  en: The name is too long
  zh-TW: 名稱太長
  zh-CN: 名称太长
  de: Der Name ist zu lang
  es: El nombre es demasiado largo
  pt-BR: O nome é longo demais
  ja: 名前が長すぎます
name.reserved:
  en: This name is reserved by Windows
  zh-TW: 這是 Windows 保留的名稱
  zh-CN: 这是 Windows 保留的名称
  de: Dieser Name ist von Windows reserviert
  es: Windows reserva este nombre
  pt-BR: Este nome é reservado pelo Windows
  ja: この名前は Windows で予約されています

# ─── Listing errors (service)
io.internal:
  en: "Internal error (logged); please report it"
  zh-TW: 內部錯誤（已記錄），請回報
  zh-CN: 内部错误（已记录），请反馈
  de: Interner Fehler (protokolliert); bitte melden
  es: Error interno (registrado); infórmelo, por favor
  pt-BR: Erro interno (registrado); por favor, relate-o
  ja: 内部エラー（ログに記録済み）。報告してください
io.not_found:
  en: This location can't be found
  zh-TW: 找不到這個位置
  zh-CN: 找不到此位置
  de: Dieser Ort wurde nicht gefunden
  es: No se encuentra esta ubicación
  pt-BR: Este local não foi encontrado
  ja: この場所が見つかりません
io.denied:
  en: Access denied
  zh-TW: 沒有存取權限
  zh-CN: 没有访问权限
  de: Zugriff verweigert
  es: Acceso denegado
  pt-BR: Acesso negado
  ja: アクセスが拒否されました
io.not_dir:
  en: "This isn't a folder"
  zh-TW: 這不是資料夾
  zh-CN: 这不是文件夹
  de: Dies ist kein Ordner
  es: Esto no es una carpeta
  pt-BR: Isto não é uma pasta
  ja: フォルダーではありません
io.too_large:
  en: The file is too large
  zh-TW: 檔案太大
  zh-CN: 文件太大
  de: Die Datei ist zu groß
  es: El archivo es demasiado grande
  pt-BR: O arquivo é grande demais
  ja: ファイルが大きすぎます

