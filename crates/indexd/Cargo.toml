[package]
name = "arke-indexd"
description = "Optional Arke background service: reads the NTFS MFT and USN journal for whole-computer search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "arke-indexd"
path = "src/main.rs"

[dependencies]
arke-core.workspace = true
flume.workspace = true
log.workspace = true
parking_lot.workspace = true
env_logger.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
]

[lints]
workspace = true

[dev-dependencies]
env_logger.workspace = true
