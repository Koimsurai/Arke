# cargo deny check: license allowlist and source restrictions.
# No GPL dependencies (parts of Zed are GPL-3.0 and are only used as reference).
[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
private = { ignore = true }

[advisories]
version = 2
unmaintained = "workspace"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
